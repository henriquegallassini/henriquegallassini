name: Sync Latest Repositories

on:
  schedule:
    - cron: "23 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-profile
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Update latest repositories
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import datetime
          import html
          import json
          import os
          import re
          import urllib.request

          owner = os.environ["OWNER"]
          token = os.environ["GH_TOKEN"]

          API_VERSION = "2026-03-10"

          def github_api(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": API_VERSION,
                      "User-Agent": "github-profile-readme-sync",
                  },
              )

              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          repos_url = (
              f"https://api.github.com/users/{owner}/repos"
              "?type=owner"
              "&sort=pushed"
              "&direction=desc"
              "&per_page=100"
          )

          repositories = github_api(repos_url)

          repositories = [
              repo
              for repo in repositories
              if not repo.get("fork", False)
              and not repo.get("archived", False)
              and not repo.get("disabled", False)
              and repo["name"].lower() != owner.lower()
          ]

          repositories = repositories[:6]

          blocks = []

          for repo in repositories:
              languages = github_api(repo["languages_url"])

              top_languages = sorted(
                  languages.items(),
                  key=lambda item: item[1],
                  reverse=True,
              )[:4]

              language_badges = " ".join(
                  f"`{language}`"
                  for language, _ in top_languages
              )

              if not language_badges:
                  language_badges = "`Repository`"

              description = repo.get("description")

              if description:
                  description = re.sub(
                      r"\s+",
                      " ",
                      description,
                  ).strip()
                  description = html.escape(description)
              else:
                  description = "Public GitHub repository."

              pushed_at = datetime.datetime.fromisoformat(
                  repo["pushed_at"].replace("Z", "+00:00")
              )

              pushed_date = pushed_at.strftime("%d %b %Y")

              stars = repo.get("stargazers_count", 0)

              block = f"""### 📦 [{repo['name']}]({repo['html_url']})

          {description}

          {language_badges}

          <sub>⭐ {stars} &nbsp;•&nbsp; Last push: {pushed_date}</sub>"""

              blocks.append(block)

          generated = "\n\n---\n\n".join(blocks)

          start_marker = "<!-- AUTO-REPOS:START -->"
          end_marker = "<!-- AUTO-REPOS:END -->"

          replacement = (
              start_marker
              + "\n"
              + generated
              + "\n"
              + end_marker
          )

          with open(
              "README.md",
              "r",
              encoding="utf-8",
          ) as file:
              readme = file.read()

          pattern = re.compile(
              re.escape(start_marker)
              + r".*?"
              + re.escape(end_marker),
              re.DOTALL,
          )

          if not pattern.search(readme):
              raise RuntimeError(
                  "AUTO-REPOS markers were not found in README.md"
              )

          updated_readme = pattern.sub(
              replacement,
              readme,
          )

          with open(
              "README.md",
              "w",
              encoding="utf-8",
          ) as file:
              file.write(updated_readme)

          print(
              f"Updated README with "
              f"{len(repositories)} repositories."
          )
          PY

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No repository changes detected."
            exit 0
          fi

          git commit -m "chore: sync latest repositories"
          git push
